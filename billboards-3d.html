<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novibet · Billboards 3D</title><style>
:root{--bg:#020713;--panel:#071427;--cyan:#00d7ff;--green:#00d39b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#071b29 0,#020713 42%);color:white;font-family:Arial,Helvetica,sans-serif}a{color:white;text-decoration:none}header{position:sticky;top:0;z-index:20;background:rgba(2,7,19,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,215,255,.18);padding:14px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em}.brand span{color:var(--green)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lang button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;cursor:pointer}.lang button.active{background:linear-gradient(90deg,var(--cyan),var(--green));color:#00131c;border-color:transparent}main{max-width:1500px;margin:auto;padding:40px 24px 80px}.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.12em}h1{font-size:clamp(42px,6vw,82px);line-height:.95;margin:8px 0 12px}.lead{color:#c7d4e3;font-size:18px;max-width:980px;line-height:1.5}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 30px}.pill{padding:10px 14px;border-radius:999px;background:rgba(0,215,255,.08);border:1px solid rgba(0,215,255,.25);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}.card{background:rgba(7,20,39,.84);border:1px solid rgba(0,215,255,.2);border-radius:22px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(0,215,255,.55)}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#071427;padding:20px}.meta{padding:15px 16px}.loc{font-size:22px;font-weight:950}.tag{color:var(--green);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-top:8px}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal img{max-width:95vw;max-height:88vh;object-fit:contain}.close,.prev,.next{position:fixed;border:0;background:rgba(255,255,255,.12);color:white;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer}.close{top:18px;right:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}@media(max-width:650px){main{padding:28px 14px 60px}.grid{grid-template-columns:1fr}}</style></head><body>
<header><a class="brand" href="index.html#billboards">TBRL · <span>novibet</span></a><div class="tools"><a href="index.html#billboards">← <span data-es="Volver al reporte" data-en="Back to report">Volver al reporte</span></a><div class="lang"><button class="active" data-lang="es">ES</button><button data-lang="en">EN</button></div></div></header>
<main><div class="eyebrow">BILLBOARDS 3D · APPLIED CREATIVE</div><h1 data-es="Billboards 3D" data-en="3D Billboards">Billboards 3D</h1><p class="lead" data-es="Apartado independiente para las 5 pantallas 3D que aprovecharon el arte de campaña. Se mantiene fuera del reporte principal para conservar la lectura ejecutiva." data-en="Independent section for the 5 3D screens that leveraged the campaign creative. It stays outside the main report to preserve executive readability.">Apartado independiente para las 5 pantallas 3D que aprovecharon el arte de campaña. Se mantiene fuera del reporte principal para conservar la lectura ejecutiva.</p><div class="summary"><span class="pill">5 <span data-es="pantallas" data-en="screens">pantallas</span></span><span class="pill">Billboards 3D · Novibet</span></div><div class="grid" id="gallery"></div></main><div class="modal" id="modal"><button class="close">×</button><button class="prev">‹</button><img alt="Billboard 3D"><button class="next">›</button></div><script>const ITEMS=[{"name": "Pantalla 01", "img": "billboards-3d/billboard_1.png", "desc": "Aplicación 3D · Novibet"}, {"name": "Pantalla 02", "img": "billboards-3d/billboard_2.png", "desc": "Aplicación 3D · Novibet"}, {"name": "Pantalla 03", "img": "billboards-3d/billboard_3.png", "desc": "Aplicación 3D · Novibet"}, {"name": "Pantalla 04", "img": "billboards-3d/billboard_4.png", "desc": "Arte aplicado · La Calle es Nuestra Cancha"}, {"name": "Pantalla 05", "img": "billboards-3d/billboard_5.png", "desc": "Arte aplicado · Vive la Pasión"}]; let current=0; const g=document.getElementById('gallery'),m=document.getElementById('modal'),img=m.querySelector('img'); function render(){g.innerHTML=ITEMS.map((x,i)=>`<article class="card" data-i="${i}"><img loading="lazy" src="${x.img}" alt="${x.name}"><div class="meta"><div class="loc">${x.name}</div><div class="tag">${x.desc}</div></div></article>`).join(''); g.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.i));} function openModal(i){current=i; img.src=ITEMS[i].img; m.classList.add('open')} function nav(d){current=(current+d+ITEMS.length)%ITEMS.length; img.src=ITEMS[current].img;} render(); m.querySelector('.close').onclick=()=>m.classList.remove('open'); m.querySelector('.prev').onclick=()=>nav(-1); m.querySelector('.next').onclick=()=>nav(1); m.onclick=e=>{if(e.target===m)m.classList.remove('open')}; addEventListener('keydown',e=>{if(!m.classList.contains('open'))return; if(e.key==='Escape')m.classList.remove('open'); if(e.key==='ArrowLeft')nav(-1); if(e.key==='ArrowRight')nav(1);}); function setLang(l){document.documentElement.lang=l; document.querySelectorAll('[data-es]').forEach(el=>el.textContent=el.dataset[l]); document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l)); localStorage.setItem('novibetLang',l)} document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); setLang(localStorage.getItem('novibetLang')||'es');</script></body></html>
