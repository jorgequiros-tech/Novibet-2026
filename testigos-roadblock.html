<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novibet · Testigos Roadblock</title><style>
:root{--bg:#020713;--panel:#071427;--cyan:#00d7ff;--green:#00d39b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#071b29 0,#020713 42%);color:white;font-family:Arial,Helvetica,sans-serif}a{color:white;text-decoration:none}header{position:sticky;top:0;z-index:20;background:rgba(2,7,19,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,215,255,.18);padding:14px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em}.brand span{color:var(--green)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lang button,.cta{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.lang button.active,.cta.primary{background:linear-gradient(90deg,var(--cyan),var(--green));color:#00131c;border-color:transparent}main{max-width:1500px;margin:auto;padding:40px 24px 80px}.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.12em}h1{font-size:clamp(42px,6vw,82px);line-height:.95;margin:8px 0 12px}.lead{color:#c7d4e3;font-size:18px;max-width:980px;line-height:1.5}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.card{background:rgba(7,20,39,.8);border:1px solid rgba(0,215,255,.22);border-radius:20px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(0,215,255,.55)}.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#071427}.meta{padding:14px 16px;font-weight:900}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal img{max-width:95vw;max-height:88vh;object-fit:contain}.close,.prev,.next{position:fixed;border:0;background:rgba(255,255,255,.12);color:white;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer}.close{top:18px;right:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}@media(max-width:650px){main{padding:28px 14px 60px}.grid{grid-template-columns:1fr}}</style></head><body>

<main><div class="eyebrow">ROADBLOCK · PROOF OF POSTING</div><h1 data-es="Testigos Roadblock" data-en="Roadblock Proof of Posting">Testigos Roadblock</h1><p class="lead" data-es="Vista previa del deck de testigos del bonus Roadblock. Aquí se muestra una selección de slides y se mantiene un acceso directo al documento completo en PDF." data-en="Preview of the Roadblock bonus proof-of-posting deck. A selection of slides is shown here, along with direct access to the full PDF document.">Vista previa del deck de testigos del bonus Roadblock. Aquí se muestra una selección de slides y se mantiene un acceso directo al documento completo en PDF.</p><div class="actions"><a class="cta primary" href="roadblock.pdf" target="_blank">Abrir deck completo</a><a class="cta" href="roadblock.pdf" download>Descargar PDF</a></div><div class="grid" id="gallery"></div></main><div class="modal" id="modal"><button class="close">×</button><button class="prev">‹</button><img alt="Roadblock preview"><button class="next">›</button></div><script>const ITEMS=[{"title": "Slide 01", "img": "roadblock-preview/slide-001.jpg"}, {"title": "Slide 02", "img": "roadblock-preview/slide-002.jpg"}, {"title": "Slide 03", "img": "roadblock-preview/slide-003.jpg"}, {"title": "Slide 04", "img": "roadblock-preview/slide-004.jpg"}, {"title": "Slide 05", "img": "roadblock-preview/slide-005.jpg"}, {"title": "Slide 06", "img": "roadblock-preview/slide-006.jpg"}, {"title": "Slide 07", "img": "roadblock-preview/slide-007.jpg"}, {"title": "Slide 08", "img": "roadblock-preview/slide-008.jpg"}, {"title": "Slide 09", "img": "roadblock-preview/slide-009.jpg"}, {"title": "Slide 10", "img": "roadblock-preview/slide-010.jpg"}, {"title": "Slide 11", "img": "roadblock-preview/slide-011.jpg"}, {"title": "Slide 12", "img": "roadblock-preview/slide-012.jpg"}]; let visible=ITEMS.slice(),current=0; const g=document.getElementById('gallery'),m=document.getElementById('modal'),img=m.querySelector('img'); function render(){g.innerHTML=ITEMS.map((x,i)=>`<article class="card" data-i="${i}"><img loading="lazy" src="${x.img}" alt="${x.title}"><div class="meta">${x.title}</div></article>`).join(''); g.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.i));} function openModal(i){current=i; img.src=ITEMS[i].img; m.classList.add('open')} function nav(d){current=(current+d+ITEMS.length)%ITEMS.length; img.src=ITEMS[current].img;} render(); m.querySelector('.close').onclick=()=>m.classList.remove('open'); m.querySelector('.prev').onclick=()=>nav(-1); m.querySelector('.next').onclick=()=>nav(1); m.onclick=e=>{if(e.target===m)m.classList.remove('open')}; addEventListener('keydown',e=>{if(!m.classList.contains('open'))return; if(e.key==='Escape')m.classList.remove('open'); if(e.key==='ArrowLeft')nav(-1); if(e.key==='ArrowRight')nav(1);}); function setLang(l){document.documentElement.lang=l; document.querySelectorAll('[data-es]').forEach(el=>el.textContent=el.dataset[l]); document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l)); localStorage.setItem('novibetLang',l)} document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); setLang(localStorage.getItem('novibetLang')||'es');</script></body></html>
