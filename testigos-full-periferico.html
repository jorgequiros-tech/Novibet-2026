<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novibet · Full Periférico</title><style>

v,.next{position:fixed;border:0;background:rgba(255,255,255,.12);color:white;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer}.close{top:18px;right:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}</style></head><body><header><a class="brand" href="index.html#bonus">TBRL · <span>novibet</span></a><div class="tools"><a href="index.html#bonus">← <span data-es="Volver al reporte" data-en="Back to report">Volver al reporte</span></a><div class="lang"><button class="active" data-lang="es">ES</button><button data-lang="en">EN</button></div></div></header><main><div class="eyebrow">BONUS · FULL PERIFÉRICO</div><h1 data-es="Testigos Full Periférico" data-en="Full Periférico Proof of Posting">Testigos Full Periférico</h1><p class="lead" data-es="Evidencia fotográfica de la activación Full Periférico del 11 de junio." data-en="Photographic proof of the Full Periférico activation on June 11.">Evidencia fotográfica de la activación Full Periférico del 11 de junio.</p><div class="summary"><span class="pill">22 <span data-es="testigos" data-en="proof images">testigos</span></span><span class="pill">15 min · CDMX</span></div><div class="grid" id="gallery"></div></main><div class="modal" id="modal"><button class="close">×</button><button class="prev">‹</button><img alt="Testigo"><button class="next">›</button></div><script>const ITEMS=[{"name": "COL_491 N", "img": "testigos-full-periferico/testigo-01.jpg"}, {"name": "COL_491 S", "img": "testigos-full-periferico/testigo-02.jpg"}, {"name": "COL_542 N", "img": "testigos-full-periferico/testigo-03.jpg"}, {"name": "COL_542 S", "img": "testigos-full-periferico/testigo-04.jpg"}, {"name": "COL_588 N", "img": "testigos-full-periferico/testigo-05.jpg"}, {"name": "COL_588 S", "img": "testigos-full-periferico/testigo-06.jpg"}, {"name": "COL_706 N", "img": "testigos-full-periferico/testigo-07.jpg"}, {"name": "COL_706 S", "img": "testigos-full-periferico/testigo-08.jpg"}, {"name": "COL_735 N", "img": "testigos-full-periferico/testigo-09.jpg"}, {"name": "COL_735 S", "img": "testigos-full-periferico/testigo-10.jpg"}, {"name": "COL_778 N", "img": "testigos-full-periferico/testigo-11.jpg"}, {"name": "COL_778 S", "img": "testigos-full-periferico/testigo-12.jpg"}, {"name": "COL_802 N", "img": "testigos-full-periferico/testigo-13.jpg"}, {"name": "COL_802 S", "img": "testigos-full-periferico/testigo-14.jpg"}, {"name": "COL_863 N", "img": "testigos-full-periferico/testigo-15.jpg"}, {"name": "COL_863 S", "img": "testigos-full-periferico/testigo-16.jpg"}, {"name": "COL_897 N", "img": "testigos-full-periferico/testigo-17.jpg"}, {"name": "COL_897 S", "img": "testigos-full-periferico/testigo-18.jpg"}, {"name": "POR_0008 PORTICO PORT", "img": "testigos-full-periferico/testigo-19.jpg"}, {"name": "POR_0015 PORTICO PORT", "img": "testigos-full-periferico/testigo-20.jpg"}, {"name": "POR_0078 PORTICO PORT", "img": "testigos-full-periferico/testigo-21.jpg"}, {"name": "POR_0092 PORTICO PORT", "img": "testigos-full-periferico/testigo-22.jpg"}];let c=0;const g=document.getElementById('gallery'),m=document.getElementById('modal'),im=m.querySelector('img');g.innerHTML=ITEMS.map((x,i)=>`<article class="card" data-i="${i}"><img loading="lazy" src="${x.img}" alt="${x.name}"><div class="meta">${x.name}</div></article>`).join('');g.querySelectorAll('.card').forEach(x=>x.onclick=()=>{c=+x.dataset.i;im.src=ITEMS[c].img;m.classList.add('open')});function nav(d){c=(c+d+ITEMS.length)%ITEMS.length;im.src=ITEMS[c].img}m.querySelector('.close').onclick=()=>m.classList.remove('open');m.querySelector('.prev').onclick=()=>nav(-1);m.querySelector('.next').onclick=()=>nav(1);m.onclick=e=>{if(e.target===m)m.classList.remove('open')};function setLang(l){document.documentElement.lang=l;document.querySelectorAll('[data-es]').forEach(el=>el.textContent=el.dataset[l]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));localStorage.setItem('novibetLang',l)}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(localStorage.getItem('novibetLang')||'es');</script></body></html>
