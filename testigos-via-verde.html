le('active',b.dataset.lang===l)); document.getElementById('search-calle').placeholder=l==='es'?'Buscar por columna o lado…':'Search by column or side…'; document.getElementById('search-vive').placeholder=l==='es'?'Buscar por columna o lado…':'Search by column or side…'; localStorage.setItem('novibetLang',l); ['calle','vive'].forEach(key=>renderPanel(key,document.getElementById('search-'+key).value));} document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); setLang(localStorage.getItem('novibetLang')||'es');</script></body></html>
